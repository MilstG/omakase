name: "Wa 輪 · bajar fotos"

# Se corre a mano desde la pestaña Actions → "Wa 輪 · bajar fotos" → Run workflow.
# Baja las fotos de Wikimedia Commons con tools/fetch-wa-photos.mjs y commitea
# public/img/wa/ al repo. Railway detecta el push y deploya solo.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-bajar todas (aunque ya existan)"
        type: boolean
        default: false
      ids:
        description: "Solo estos ids, separados por espacio (vacío = todos los que falten)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bajar fotos de Wikimedia Commons
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          node tools/fetch-wa-photos.mjs $ARGS ${{ inputs.ids }}

      - name: Commitear el repositorio de fotos
        run: |
          git config user.name "wa-photos[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add public/img/wa
          if git diff --cached --quiet; then
            echo "Sin cambios: todas las fotos ya estaban."
          else
            git commit -m "Wa 輪: repositorio de fotos (Wikimedia Commons, créditos en credits.json)"
            git push
          fi
